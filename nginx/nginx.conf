# Load balancer in front of 3 identical API instances.
# This is the "no traffic should block the server" requirement:
# if one API instance is slow or dead, Nginx routes around it.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # least_conn = send each request to whichever instance currently has the
  # fewest open connections, instead of plain round-robin. Under uneven load
  # (e.g. one instance stuck on a slow query) this balances better.
  upstream api_backend {
    least_conn;
    server api1:8000 max_fails=2 fail_timeout=5s;
    server api2:8000 max_fails=2 fail_timeout=5s;
    server api3:8000 max_fails=2 fail_timeout=5s;
  }

  # Basic request logging so you can see which instance handled what
  # during the demo (docker compose logs nginx).
  log_format upstream_log '$remote_addr - [$time_local] "$request" '
                          'status=$status upstream=$upstream_addr '
                          'rt=$request_time uart=$upstream_response_time';
  access_log /var/log/nginx/access.log upstream_log;

  server {
    listen 80;

    # Fail over to the next instance quickly instead of waiting on a dead one.
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    location / {
      proxy_pass http://api_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Quick way to see which instance answered, without reading logs.
    location = /whoami {
      proxy_pass http://api_backend/health;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
